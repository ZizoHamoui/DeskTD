<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" font-family="Arial, sans-serif" font-size="13">

  <!-- ── WAVE STATES (top row) ── -->
  <!-- Wave 1 -->
  <ellipse cx="160" cy="50" rx="120" ry="32" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="160" y="45" text-anchor="middle" font-size="12">Wave 1:</text>
  <text x="160" y="61" text-anchor="middle" font-size="12">Learning state: Basic</text>

  <!-- Wave 2 -->
  <ellipse cx="430" cy="50" rx="120" ry="32" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="430" y="45" text-anchor="middle" font-size="12">Wave 2:</text>
  <text x="430" y="61" text-anchor="middle" font-size="12">Learning state: Secondary</text>

  <!-- Wave 3 -->
  <ellipse cx="700" cy="50" rx="120" ry="32" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="700" y="45" text-anchor="middle" font-size="12">Wave 3:</text>
  <text x="700" y="61" text-anchor="middle" font-size="12">Growth state</text>

  <!-- Wave arrows -->
  <line x1="280" y1="50" x2="305" y2="50" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="50" x2="575" y2="50" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── WAVES hub ── -->
  <ellipse cx="270" cy="185" rx="55" ry="30" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="270" y="190" text-anchor="middle" font-size="13">Waves</text>

  <!-- Waves → Wave1 -->
  <line x1="228" y1="162" x2="175" y2="82" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Waves → Wave2 (implied by level progression, shown as connection to Level Starts) -->

  <!-- ── LEVEL STARTS (center) ── -->
  <ellipse cx="460" cy="330" rx="75" ry="35" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="460" y="325" text-anchor="middle" font-size="13">Level</text>
  <text x="460" y="341" text-anchor="middle" font-size="13">Starts</text>

  <!-- Level Starts → Waves -->
  <line x1="392" y1="308" x2="307" y2="205" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── NARRATIVE GATES (unique to Level 1) ── -->
  <ellipse cx="200" cy="260" rx="88" ry="33" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="200" y="255" text-anchor="middle" font-size="12">Narrative gates</text>
  <text x="200" y="270" text-anchor="middle" font-size="11">(dismiss to progress)</text>

  <!-- Level Starts → Narrative gates -->
  <line x1="387" y1="320" x2="288" y2="273" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── LEFT COLUMN: tutorial gameplay loop ── -->

  <!-- Place Spark Tower -->
  <ellipse cx="115" cy="370" rx="98" ry="33" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="115" y="365" text-anchor="middle" font-size="12">Place Spark Tower</text>
  <text x="115" y="381" text-anchor="middle" font-size="12">to earn sparks</text>

  <!-- Narrative gates → Place Spark Tower -->
  <line x1="142" y1="291" x2="115" y2="337" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Earn 10 sparks -->
  <ellipse cx="115" cy="460" rx="90" ry="30" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="115" y="455" text-anchor="middle" font-size="12">Earn 10 sparks</text>
  <text x="115" y="471" text-anchor="middle" font-size="12">→ wave unlocks</text>

  <!-- Place Spark Tower → Earn 10 sparks -->
  <line x1="115" y1="403" x2="115" y2="430" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Place combat tower -->
  <ellipse cx="115" cy="545" rx="98" ry="30" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="115" y="540" text-anchor="middle" font-size="12">Place stationery</text>
  <text x="115" y="556" text-anchor="middle" font-size="12">to attack enemy</text>

  <!-- Earn sparks → Place combat tower -->
  <line x1="115" y1="490" x2="115" y2="515" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Kill enemy → pickup drops -->
  <ellipse cx="115" cy="630" rx="98" ry="30" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="115" y="625" text-anchor="middle" font-size="12">Kill enemy →</text>
  <text x="115" y="641" text-anchor="middle" font-size="12">spark pickup drops</text>

  <!-- Place combat → kill enemy -->
  <line x1="115" y1="575" x2="115" y2="600" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- repeat arrow back up -->
  <path d="M 213 630 Q 270 590 213 545" fill="none" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="262" y="590" text-anchor="middle" font-size="11">repeat</text>

  <!-- ── RIGHT COLUMN: obstacles ── -->

  <!-- Obstacles hub -->
  <ellipse cx="680" cy="210" rx="70" ry="30" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="680" y="215" text-anchor="middle" font-size="13">Obstacles</text>

  <!-- Level Starts → Obstacles -->
  <line x1="533" y1="313" x2="623" y2="228" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Ink tiles spread -->
  <ellipse cx="680" cy="330" rx="105" ry="33" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="680" y="325" text-anchor="middle" font-size="12">Ink tiles spread</text>
  <text x="680" y="341" text-anchor="middle" font-size="12">as enemies walk</text>

  <!-- Obstacles → Ink tiles -->
  <line x1="680" y1="240" x2="680" y2="297" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Ink shield on enemies -->
  <ellipse cx="680" cy="430" rx="108" ry="33" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="680" y="425" text-anchor="middle" font-size="12">Ink shield activates</text>
  <text x="680" y="441" text-anchor="middle" font-size="12">on following enemies</text>

  <!-- Ink tiles → Ink shield -->
  <line x1="680" y1="363" x2="680" y2="397" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Use Eraser -->
  <ellipse cx="680" cy="530" rx="105" ry="33" fill="white" stroke="black" stroke-width="1.5"/>
  <text x="680" y="525" text-anchor="middle" font-size="12">Use Eraser to</text>
  <text x="680" y="541" text-anchor="middle" font-size="12">clean ink tiles</text>

  <!-- Ink shield → Use Eraser -->
  <line x1="680" y1="463" x2="680" y2="497" stroke="black" stroke-width="1.5" marker-end="url(#arrow)"/>


  <!-- ── ARROWHEAD MARKER ── -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="black"/>
    </marker>
  </defs>

</svg>
